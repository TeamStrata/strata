# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go Unit Test

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    services:
      # Label used to access the service container
      postgres:
        #Docker Hub image
        image: postgres
        ports:
            # Maps tcp port 5432 on service container to the host
            - 5432:5432
        # Provide the password for postgres
        env:
          POSTGRES_DB: strata
          POSTGRES_USER: strata
          POSTGRES_PASSWORD: atarts
          # Set health checks to wait until postgres has started
          options: >-
            --health-cmd pg_isready
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5
          
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: test
      run: docker ps -a 

    - name: Run Database Migrations
      run: docker exec postgres psql  psql -c "BEGIN TRANSACTION;" -f database/1_schema.sql -f database/2_data.sql -c "COMMIT;" postgresql://strata:atarts@postgres:5432/strata

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24.1'

    - name: Install Dependencies
      run: go get ./cmd

    - name: Build
      run: go build -o strata -v ./cmd

    - name: Test
      run: go test -v ./pkg/test
      env: 
        POSTGRES_HOST: postgres
        DB_HOSTNAME: postgres
        DB_USERNAME: strata
        DB_PASSWORD: atarts
        DB_DATABASE: strata
        DB_PORT: 5432
      


