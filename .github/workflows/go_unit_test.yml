# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go Unit Test

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:  
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Start postgres with init script
      run: |
        docker run -d --name strata \
          -e POSTGRES_DB=strata \
          -e POSTGRES_USER=strata \
          -e POSTGRES_PASSWORD=atarts \
          -v ${{ github.workspace }}/database:/docker-entrypoint-initdb.d \
          -p 5432:5432 \
          postgres

    - name: Wait for Postgres
      run: |
        until docker exec strata pg_isready; do
          echo "Waiting for postgres..."
          sleep 2
        done

    - name: Overwrite .env File
      run: cp .env.actions .env
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24.1'

    - name: Install Dependencies
      run: go get ./cmd

    - name: Test
      run: go test -v ./pkg/test
      env: 
        POSTGRES_HOST: localhost
        STRATA_RELEASE: true
        DB_HOSTNAME: localhost
        DB_USERNAME: strata
        DB_PASSWORD: atarts
        DB_DATABASE: strata
        DB_PORT: 5432
      


