definitions:
  api.RoleUpdateRequest:
    description: Request body for updating role information
    properties:
      color:
        type: string
      id:
        type: integer
      name:
        type: string
      permissions:
        items:
          type: integer
        type: array
    type: object
  database.Permission:
    properties:
      id:
        type: integer
      name:
        type: string
      scope:
        $ref: '#/definitions/database.ScopeType'
    type: object
  database.Query:
    properties:
      id:
        type: integer
      literal:
        type: string
      name:
        type: string
    type: object
  database.Role:
    properties:
      color:
        type: string
      id:
        type: integer
      name:
        type: string
      permissions:
        items:
          $ref: '#/definitions/database.Permission'
        type: array
      usercount:
        type: integer
    type: object
  database.ScopeType:
    enum:
    - global
    - dashboard
    - ""
    type: string
    x-enum-varnames:
    - GlobalScope
    - DashboardScope
    - EmptyScope
  database.User:
    properties:
      id:
        type: integer
      password:
        type: string
      role:
        items:
          type: integer
        type: array
      username:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/admin/dashboard/{did}/role/{rid}/permission/{pid}:
    delete:
      consumes:
      - application/json
      description: Deletes a permission from a role associated with a given dashboard.
      parameters:
      - description: Dashboard ID
        in: path
        name: did
        required: true
        type: integer
      - description: Role ID
        in: path
        name: rid
        required: true
        type: integer
      - description: Permission ID
        in: path
        name: pid
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Delete a permission from a role for a specific dashboard
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: Adds a permission to a role associated with a given dashboard.
      parameters:
      - description: Dashboard ID
        in: path
        name: did
        required: true
        type: integer
      - description: Role ID
        in: path
        name: rid
        required: true
        type: integer
      - description: Permission ID
        in: path
        name: pid
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Add a permission to a role for a specific dashboard
      tags:
      - Admin
  /api/isadmin/{uname}:
    get:
      description: Returns a boolean indicating if the specified user is an admin.
      parameters:
      - description: Username
        in: path
        name: uname
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: isAdmin
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: User Not Found
          schema:
            type: string
      summary: Check admin status
      tags:
      - Authentication
  /auth:
    get:
      description: Checks if the session UUID cookie is set and corresponds to an
        active user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "204":
          description: No Content
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: Authenticate session
      tags:
      - Authentication
  /login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and sets a session cookie.
      parameters:
      - description: User credentials
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/database.User'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              isAdmin:
                type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: User login
      tags:
      - Authentication
  /logout:
    post:
      description: Deletes the user's session UUID from the active users map.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "204":
          description: No Content
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: User logout
      tags:
      - Authentication
  /permissions:
    get:
      description: Retrieves all permissions from the database regardless of scope.
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved all permissions
          schema:
            items:
              $ref: '#/definitions/database.Permission'
            type: array
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get all permissions
      tags:
      - Permissions
  /permissions/{scope}:
    get:
      description: Retrieves all permissions filtered by a specific scope (e.g., global,
        server, channel).
      parameters:
      - description: Permission scope
        enum:
        - global
        - server
        - channel
        in: path
        name: scope
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved scoped permissions
          schema:
            items:
              $ref: '#/definitions/database.Permission'
            type: array
        "400":
          description: Bad Request - Invalid or missing scope parameter
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get permissions by scope
      tags:
      - Permissions
  /ping:
    get:
      description: Responds with "pong" to check API status.
      produces:
      - application/json
      responses:
        "200":
          description: 'Returns message: pong'
          schema:
            properties:
              message:
                type: string
            type: object
      summary: Ping test
      tags:
      - Utility
  /queries:
    get:
      description: Returns the list of custom queries created on the system.
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved users
          schema:
            items:
              $ref: '#/definitions/database.Query'
            type: array
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: List Queries
      tags:
      - Queries
  /query/{qid}:
    delete:
      description: Delete a custom query from the database.
      parameters:
      - description: Query name or ID
        in: query
        name: qid
        type: string
      responses:
        "200":
          description: OK
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Delete Query
      tags:
      - Queries
    get:
      description: Returns information about a single query
      parameters:
      - description: Query name or ID to retrieve
        in: query
        name: qid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/database.Query'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get Single Query
      tags:
      - Queries
  /query/{qid}/execute:
    get:
      description: Execute a custom query and return the custom rows and columns
      parameters:
      - description: Query name or ID
        in: query
        name: qid
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Execute Query
      tags:
      - Queries
  /role:
    post:
      consumes:
      - application/json
      description: Creates a new role in the database with optional permissions.
      parameters:
      - description: Role to be created
        in: body
        name: role
        required: true
        schema:
          $ref: '#/definitions/database.Role'
      produces:
      - application/json
      responses:
        "200":
          description: Role created successfully
          schema:
            type: string
        "400":
          description: Bad Request - Invalid JSON format
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Add a new role
      tags:
      - Roles
  /role/{rid}:
    delete:
      description: Deletes a role from the database and removes all associated permissions.
      parameters:
      - description: Role ID
        in: path
        name: rid
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Role deleted successfully
          schema:
            type: string
        "400":
          description: Bad Request - Invalid role ID
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Delete a role
      tags:
      - Roles
    patch:
      consumes:
      - application/json
      description: Updates an existing role's name, color, and/or permissions. Only
        provided fields will be updated.
      parameters:
      - description: Role ID
        in: path
        name: rid
        required: true
        type: integer
      - description: Role update data
        in: body
        name: role
        required: true
        schema:
          $ref: '#/definitions/api.RoleUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Role updated successfully
          schema:
            type: string
        "400":
          description: Bad Request - Invalid role ID or JSON format
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Update a role
      tags:
      - Roles
  /roles:
    get:
      description: Retrieves a list of roles with their permissions and user counts.
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved roles with user counts
          schema:
            items:
              $ref: '#/definitions/database.Role'
            type: array
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get roles
      tags:
      - Roles
  /signup:
    post:
      consumes:
      - application/json
      description: Creates a new user, hashes their password, stores them in the database,
        and sets a session cookie.
      parameters:
      - description: New user details
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/database.User'
      produces:
      - application/json
      responses:
        "200":
          description: User created successfully
          schema:
            type: string
        "400":
          description: Bad Request - Invalid JSON format
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: User signup
      tags:
      - Authentication
  /user/{uid}:
    get:
      description: Retrieves a single user from the database by their ID.
      parameters:
      - description: User ID
        in: path
        name: uid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved user
          schema:
            $ref: '#/definitions/database.User'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get user by ID
      tags:
      - Users
    patch:
      consumes:
      - application/json
      description: Updates user data in the database. Password will be hashed if provided.
      parameters:
      - description: User ID
        in: path
        name: uid
        required: true
        type: integer
      - description: Updated user data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/database.User'
      produces:
      - application/json
      responses:
        "200":
          description: User updated successfully
          schema:
            type: string
        "400":
          description: Bad Request - Invalid user ID or JSON format
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Update a user
      tags:
      - Users
  /user/{uname}:
    delete:
      description: Deletes a user from the database and removes their session from
        active users.
      parameters:
      - description: User name
        in: path
        name: uname
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User deleted successfully
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Delete user by name
      tags:
      - Users
  /user/{uname}/role/{rname}:
    delete:
      description: Removes a specific role from a user.
      parameters:
      - description: User name
        in: path
        name: uname
        required: true
        type: string
      - description: Role name
        in: path
        name: rname
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Role removed successfully
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Remove user role
      tags:
      - User Roles
    post:
      description: Assigns a specific role to a user.
      parameters:
      - description: User name
        in: path
        name: uname
        required: true
        type: string
      - description: Role name
        in: path
        name: rname
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Role assigned successfully
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Add user role
      tags:
      - User Roles
  /users:
    get:
      description: Retrieves a list of all users from the database.
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved users
          schema:
            items:
              $ref: '#/definitions/database.User'
            type: array
        "204":
          description: No Content - No users found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get all users
      tags:
      - Users
swagger: "2.0"
