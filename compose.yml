services:
  postgres:
    image: postgres:latest
    container_name: strata_psql
    ports:
      - 5432:5432
    volumes:
      - ./database:/docker-entrypoint-initdb.d
      - ./postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: strata
      POSTGRES_USER: strata
      POSTGRES_PASSWORD: atarts
  
  data:
    image: postgres:latest
    container_name: strata_data
    ports:
      - 5433:5433
    environment:
      POSTGRES_DB: data
      POSTGRES_USER: customer
      POSTGRES_PASSWORD: remotsuc
    command: -p 5433
      
  ollama:
    image: ollama/ollama
    container_name: strata_ollama
    ports:
      - 11434:11434
    volumes:
      - ./ollama:/root/.ollama
      - ./Modelfile:/root/.ollama/Modelfile

  strata:
    depends_on:
      postgres:
        condition: service_started
      ollama:
        condition: service_started
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: strata
    image: strata:live
    ports:
      - 8080:8080
    working_dir: /opt/strata
